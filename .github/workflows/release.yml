name: Publish Linux alpha (manual, public repository only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duby-alpha-release
  cancel-in-progress: false

jobs:
  release:
    # Standard Linux runners are free for public repositories. Never run this
    # publishing job on a private repository or a paid/larger runner.
    if: github.event.repository.private == false && github.repository == 'sidmuzammil/DUBY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-tools zstd
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - run: npm ci
      - run: npm run check
      - run: cargo test --workspace --locked
      - name: Local fixture checks (no hosted inference)
        run: |
          cargo build -p duby-broker --example socket_harness --locked
          node tests/runtime-smoke.mjs
          node tests/runtime-file-flow.mjs
          node tests/runtime-security.mjs
      - name: Build Linux packages
        run: npm run package
      - name: Inspect the installer and prepare its checksum
        run: |
          test "$(dpkg-deb --field .artifacts/packages/Duby_0.1.0_amd64.deb Architecture)" = amd64
          dpkg-deb --info .artifacts/packages/Duby_0.1.0_amd64.deb
          cd .artifacts/packages
          sha256sum Duby_0.1.0_amd64.deb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload and verify the draft release, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0-alpha.1
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          cp docs/RELEASE-ALPHA.md "$RUNNER_TEMP/release-notes.md"
          printf '\nBuilt from commit: %s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$tag" .artifacts/packages/Duby_0.1.0_amd64.deb .artifacts/packages/SHA256SUMS
          mkdir -p "$RUNNER_TEMP/duby-download-check"
          gh release download "$tag" --dir "$RUNNER_TEMP/duby-download-check" --pattern Duby_0.1.0_amd64.deb --pattern SHA256SUMS
          (cd "$RUNNER_TEMP/duby-download-check" && sha256sum -c SHA256SUMS)
          gh release edit "$tag" --draft=false --prerelease --latest=false
