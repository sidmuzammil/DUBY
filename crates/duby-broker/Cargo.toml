[package]
name = "duby-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
cap-std = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
cap-fs-ext = "3"
[dev-dependencies]
tempfile = "3"
